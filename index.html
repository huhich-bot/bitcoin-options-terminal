<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTC Options & Derivatives Terminal</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.0/build/stlite.css"
    />
  </head>
  <body>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.0/build/stlite.js"></script>
    <script>
      stlite.mount({
        // Основні бібліотеки для обчислень і графіків
        requirements: [
          "pandas",
          "requests",
          "numpy",
          "plotly"
        ],
        entrypoint: "app.py",
        files: {
          // 1. Головний файл
          "app.py": { url: "./app.py" },

          // 2. Файли з папки analytics
          "analytics/__init__.py": { url: "./analytics/__init__.py" },
          // Якщо в папці analytics є інші .py файли, додайте їх за аналогією нижче:
          // "analytics/greeks.py": { url: "./analytics/greeks.py" },

          // 3. Файли з папки api
          "api/__init__.py": { url: "./api/__init__.py" },
          // "api/binance.py": { url: "./api/binance.py" },
          // "api/deribit.py": { url: "./api/deribit.py" },

          // 4. Файли з папки charts
          "charts/__init__.py": { url: "./charts/__init__.py" }
          // "charts/plots.py": { url: "./charts/plots.py" }
        }
      }, document.getElementById("root"))
    </script>
  </body>
</html>
