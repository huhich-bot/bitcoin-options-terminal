<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTC Options & Derivatives Terminal</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.0/build/stlite.css"
    />
  </head>
  <body>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.0/build/stlite.js"></script>
    <script>
      stlite.mount({
        // Бібліотеки з вашого requirements.txt
        requirements: [
          "pandas",
          "requests",
          "numpy",
          "plotly"
        ],
        entrypoint: "app.py",
        files: {
          // Завантажуємо ваш головний файл app.py
          "app.py": {
            url: "./app.py"
          }
        }
      }, document.getElementById("root"))
    </script>
  </body>
</html>
